<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure Checkout - 50 Micro SaaS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="checkout-page">
    <header class="site-header">
      <a class="brand" href="/">50 Micro SaaS.</a>
      <a class="nav-cta" href="/">Back to sales page</a>
    </header>

    <main class="checkout-shell">
      <section class="checkout-panel">

          <p class="badge">SECURE CHECKOUT</p>
          <h1>Complete your purchase.</h1>

            You will be taken to Razorpay's secure payment page to complete your purchase.
          </p>
          <a id="pay-button" class="button primary" href="https://rzp.io/rzp/AVPX4ffS">Pay with Razorpay &rarr;</a>
        </div>
        <div class="checkout-cover">
          <img src="/ebook-cover-premium.png" alt="50 Micro SaaS ebook cover" />
        </div>
      </section>
    </main>
  </body>
</html>

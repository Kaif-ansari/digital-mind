<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure Checkout - 50 Micro SaaS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="checkout-page">
    <header class="site-header">
      <a class="brand" href="/">50 Micro SaaS.</a>
      <a class="nav-cta" href="/">Back to sales page</a>
    </header>

    <main class="checkout-shell">
      <section class="checkout-panel">
        <div>
          <p class="badge">SECURE CHECKOUT</p>
          <h1>Complete your purchase.</h1>
          <p id="checkout-message">
            Your payment will be verified server-side before the ebook download is unlocked.
          </p>
          <button id="pay-button" class="button primary" type="button">Pay with Razorpay &rarr;</button>
        </div>
        <div class="checkout-cover">
          <img src="/ebook-cover-premium.png" alt="50 Micro SaaS ebook cover" />
        </div>
      </section>
    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/checkout.js"></script>
  </body>
</html>
